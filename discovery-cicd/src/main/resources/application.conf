discovery-cicd-server {
  hostname: "localhost"
  hostname: ${?DISCOVERY_CICD_SERVER_HOSTNAME}
  port: 8087
  port: ${?DISCOVERY_CICD_SERVER_PORT}
  auth-mode: "NoAuth" #  Possible values are: NoAuth, MutualTLS
  auth-mode: ${?DISCOVERY_CICD_SERVER_AUTH_METHOD}
  keystore-path: "/etc/pki/discovery.jks"
  keystore-path: ${?DISCOVERY_CICD_SERVER_KEYSTORE_PATH}
  keystore-password-env: "KEYSTORE_PASSWORD"
  keystore-password-env: ${?DISCOVERY_CICD_SERVER_KEYSTORE_PASSWORD_ENV}
  truststore-path: "/etc/pki/ca-bundle.jks"
  truststore-path: ${?DISCOVERY_CICD_SERVER_TRUSTSTORE_PATH}
  truststore-password-env: "TRUSTSTORE_PASSWORD"
  truststore-password-env: ${?DISCOVERY_CICD_SERVER_TRUSTSTORE_PASSWORD_ENV}
}

discovery-cicd-api-client {
  metabase-url: "http://localhost:3000"
  metabase-url: ${?DISCOVERY_CICD_APICLIENT_METABASE_URL}
  allow-unsafe-ssl: true
  allow-unsafe-ssl: ${?DISCOVERY_CICD_APICLIENT_ALLOW_UNSAFE_SSL}
  timeout-metabase: 20s
  timeout-metabase: ${?DISCOVERY_CICD_API_METABASE_TIMEOUT}
  timeout-export: 300s
  timeout-export: ${?DISCOVERY_CICD_API_EXPORT_TIMEOUT}
  timeout-import: 300s
  timeout-import: ${?DISCOVERY_CICD_API_IMPORT_TIMEOUT}
  # How many questions, dashboards and subscriptions an import creates at a time. One is the old
  # sequential import, which for a collection with tens of thousands of questions means one request
  # after another for hours. Four is where metabase starts saturating when it is only being read
  # from, and a write costs it more, so raising this means measuring against the instance that is
  # being slow: past the point where it saturates the import gets slower, not faster
  parallel-writes: 4
  parallel-writes: ${?DISCOVERY_CICD_IMPORT_PARALLEL_WRITES}
}

discovery-cicd-jobs {
  # Only one at a time by default: the pod is given 2 cores and an export of a big collection already
  # uses 1.8 of them, so a second one at the same time makes both slower and neither finishes sooner
  max-concurrent: 1
  max-concurrent: ${?DISCOVERY_CICD_JOBS_MAX_CONCURRENT}
  max-queued: 8
  max-queued: ${?DISCOVERY_CICD_JOBS_MAX_QUEUED}
  # Emptied on start up, and on the ephemeral filesystem of the pod: neither the jobs nor their
  # results survive a restart
  work-dir: "/tmp/discovery-cicd-jobs"
  work-dir: ${?DISCOVERY_CICD_JOBS_WORK_DIR}
  retention: 24h
  retention: ${?DISCOVERY_CICD_JOBS_RETENTION}
  max-stored-results: 10
  max-stored-results: ${?DISCOVERY_CICD_JOBS_MAX_STORED_RESULTS}
}

akka {
  http {
    server {
      request-timeout: 20s
      parsing {
        # The body of an import is a whole exported document, hundreds of MB against the 8m akka
        # allows by default. This is the limit that applies to it: the routes that take one hold
        # both the body and whatever it unpacks to to this very value (see 'ImportUploads.bigUploads',
        # which has to set it again after 'decodeRequest' because akka caps the unpacked side with a
        # setting of its own). It is meant to be kept equal to 'NGINX_CLIENT_MAX_BODY_SIZE' and to
        # the 'proxy-body-size' of the ingress, which cap the same body one and two layers earlier:
        # with the three the same, none of them cuts before another and the error does not depend on
        # where it ran out. The same value reads the same in both places, because nginx and this
        # take '512M' to mean the same thing
        max-content-length: 512M
        max-content-length: ${?DISCOVERY_CICD_API_MAX_BODY_SIZE}
      }
    }
  }
}
