info:
  name: Metabase Crossdata Driver
  version: 1.0.0-SNAPSHOT-7.0.0-jre8
  description: Allows Metabase to connect to Crossdata databases.

dependencies:
  - plugin: Metabase Spark SQL Driver

driver:
  name: crossdata
  display-name: Stratio Virtualizer
  lazy-load: true
  parent: sparksql
  connection-properties:
    - merge:
      - host
      - placeholder: localhost

    - merge:
        - port
        - default: 8000

    - user

    - name: schema-filters
      type: schema-filters
      display-name: Collections to sync

    - name: impersonate
      display-name: Connect with Discovery login user?
      default: false
      type: boolean

    - name: ssl-option
      display-name: Use a secure connection (SSL)?
      default: true
      type: boolean

    - name: additional-options
      display-name: Additional JDBC connection string options
      placeholder: prepareThreshold=0
      required: false

    - advanced-options-start
    - default-advanced-options

    - name: include-user-id-and-hash
      display-name: Include a comment with User ID and query hash in queries
      default: false
      type: boolean
      visible-if:
        advanced-options: true

init:
  - step: load-namespace
    namespace: metabase.driver.hive-like
  - step: load-namespace
    namespace: metabase.driver.sparksql
  - step: load-namespace
    namespace: metabase.driver.crossdata
  - step: register-jdbc-driver
    class: com.stratio.jdbc.core.jdbc4.StratioDriver
