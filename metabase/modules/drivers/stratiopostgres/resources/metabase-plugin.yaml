info:
  name: Custom Stratio PostgreSQL Driver
  version: 1.0.0-SNAPSHOT
  description: Postgres driver that can be configured to set a variable in the connection with the name/email of the current metabse logged user.
driver:
  name: stratiopostgres
  display-name: Stratio PostgreSQL
  lazy-load: true
  parent: postgres
  connection-properties:
    - host
    - port
    - dbname
    - user
    - password

    - name: use-ssl-authentication
      display-name: Use SSL authentication?
      type: boolean
      default: true

    - name: impersonate
      display-name: Set ROLE in postgres with the current logged user?
      default: false
      type: boolean

    - name: add-user-var
      display-name: Set a variable containing the current logged user in all queries?
      type: boolean
      default: false

    - name: user-var-name
      display-name: Name of the variable to be set with the current logged user (must contain a dot .)
      default: customvar.user_id
      visible-if:
        add-user-var: true

    - name: additional-options
      display-name: Additional JDBC connection string options
      placeholder: prepareThreshold=0&ssl=true&sslmode=verify-full&sslcert=/etc/eki/discovery.pem&sslkey=/etc/pki/discovery.pk8&sslrootcert=/etc/pki/ca-bundle.pem
      default: prepareThreshold=0
      required: false

  connection-properties-include-tunnel-config: true
init:
  - step: load-namespace
    namespace: metabase.driver.stratiopostgres
